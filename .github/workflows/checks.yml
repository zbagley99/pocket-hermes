name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: pip-audit -r requirements.txt
      - if: matrix.python == '3.12'
        run: pip-audit -r requirements-bridge.txt
      - if: matrix.python == '3.12'
        run: pip-audit -r requirements-bootstrap.txt
